*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#fff8dc,#eef7ff,#f5eaff);color:#1f2937;min-height:100vh}.wrap{max-width:980px;margin:auto;padding:14px}.box{background:#fff;border-radius:25px;padding:18px;margin-bottom:15px;box-shadow:0 8px 28px #0000000d}.hero{text-align:center}.hero h1{margin:0;font-size:clamp(30px,5vw,48px)}.muted{color:#667085}.tabs{display:flex;gap:6px;background:#eef2f7;padding:6px;border-radius:18px;margin:14px auto;max-width:620px}.tab{flex:1;border:0;background:transparent;border-radius:13px;padding:11px 5px;font-weight:850}.tab.active{background:#fff;color:#2563eb}.view{display:none}.view.active{display:block}.scoreline{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.pill{padding:9px 14px;border-radius:99px;background:#fff1b8;font-weight:850}.date{background:#e0f2fe}.progress{height:17px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:13px auto;max-width:650px}.bar{height:100%;background:linear-gradient(90deg,#facc15,#22c55e);transition:.25s}.message{text-align:center;background:#f8fafc;border-radius:14px;padding:11px;font-weight:800}.section h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.task{border:3px solid #edf1f6;border-radius:21px;padding:12px;display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:center}.task.great{background:#f0fdf4;border-color:#86efac}.task.middle{background:#fffbeb;border-color:#fde68a}.task.effort{background:#f8fafc;border-color:#cbd5e1}.pic{font-size:48px;text-align:center}.task h3{margin:0 0 8px;font-size:19px}.buttons{display:flex;gap:5px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:9px 8px;font-weight:800}.greatBtn{background:#dcfce7}.middleBtn{background:#fef3c7}.effortBtn{background:#e2e8f0}.potGrid,.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.potCard,.stat{text-align:center;background:#f8fafc;border-radius:18px;padding:1 /* aventure enfant */body.kid{background:linear-gradient(#7dd8ff 0,#dff7ff 18%,#fff6c9 48%,#dff5c9 100%)}body.kid .tabs{display:none}body.kid .hero{background:linear-gradient(135deg,#fff4a3,#ffd5ed,#d5f4ff);border:4px solid white}body.kid .hero h1{font-size:clamp(38px,7vw,58px)}body.kid .date,body.kid #dayMax,body.kid .slashMax{display:none}body.kid .pill{font-size:21px}body.kid .footer{display:none}.parentFab{position:fixed;right:14px;bottom:14px;z-index:50;border:0;border-radius:99px;padding:12px 15px;background:#ffffffd9;box-shadow:0 4px 18px #0002;font-size:20px;user-select:none}body.kid .parentFab{display:block}.kidTreasure{background:linear-gradient(135deg,#fff4a8,#ffd36c);border:4px solid #fff;border-radius:28px;padding:16px;text-align:center;box-shadow:0 8px 0 #0001;margin-bottom:18px}.chest{font-size:56px}.kidTreasure strong{display:block;font-size:21px}.adventure{position:relative;padding:8px 0}.adventure:before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:12px;transform:translateX(-50%);background:repeating-linear-gradient(#fff 0 18px,#f5c542 18px 36px);border-radius:99px;opacity:.8}.zone{position:relative;margin:22px 0 34px}.zoneTitle{display:table;position:relative;margin:auto auto 16px;background:#fff;border-radius:99px;padding:10px 20px;font-size:23px;font-weight:950;box-shadow:0 5px 0 #0001}.kidGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;position:relative}.kidCard,.kidPot{background:#fff;border:5px solid #fff;border-radius:30px;padding:15px;text-align:center;box-shadow:0 8px 0 #0001;transition:.2s}.kidCard:nth-child(odd){transform:rotate(-1deg)}.kidCard:nth-child(even){transform:rotate(1deg)}.kidCard.great{background:#eaffea;border-color:#72df7d}.kidCard.middle{background:#fff7cf;border-color:#ffd54f}.kidCard.effort{background:#f5f6f7;border-color:#d6dbe1}.kidEmoji{font-size:70px}.kidName{font-size:21px;font-weight:950;margin:5px 0 12px}.kidChoices{display:flex;justify-content:center;gap:7px}.kidChoice{width:62px;height:55px;border:0;border-radius:18px;font-size:27px;box-shadow:0 4px 0 #0002}.kidChoice:active{transform:translateY(3px)}.kidGreat{background:#bdf5c5}.kidMid{background:#ffe894}.kidTry{background:#e4e8ed}.avatar{font-size:52px;text-align:center;position:relative;z-index:2;animation:bob 1.6s infinite alternate}.finish{text-align:center;font-size:58px;position:relative;z-index:2}.badgeShelf{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.badge{background:#fff;border-radius:16px;padding:8px 10px;font-weight:850;box-shadow:0 3px 0 #0001}.pop{position:fixed;z-index:999;pointer-events:none;font-size:34px;animation:fly 1s ease-out forwards}.celebrate{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;background:#0003;animation:fade 1.5s forwards}.celebrate div{background:#fff;border-radius:35px;padding:30px;text-align:center;font-size:32px;font-weight:950;box-shadow:0 10px 40px #0003}.parentHint{font-size:12px;color:#64748b;text-align:center;margin-top:8px}@keyframes fly{to{transform:translateY(-150px) rotate(25deg) scale(1.6);opacity:0}}@keyframes bob{to{transform:translateY(-8px)}}@keyframes fade{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}@media(max-width:700px){.wrap{padding:8px}.grid{grid-template-columns:1fr}.weekGrid{grid-template-columns:repeat(4,1fr)}.kidGrid{gap:11px}.kidEmoji{font-size:57px}.kidName{font-size:17px}.kidChoice{width:50px;height:48px;font-size:22px}}@media(max-width:430px){.kidGrid{grid-template-columns:1fr}.kidCard:nth-child(n){transform:none}.potGrid,.stats{grid-template-columns:1fr}}

revenir ici.</div></div><div class="settingGroup"><h3>🎯 Récompense</h3><input class="field" id="rewardInput" oninput="updateReward(this.value)"><br><br><label>Objectif semaine : <b><span id="goalValue"></span>%</b></label><input style="width:100%" id="goalRange" type="range" min="50" max="90" step="5" oninput="updateGoal(+this.value)"></div><div class="settingGroup"><h3>🚽 Propreté</h3><b>Pipi</b><div class="modeRow"><button id="peeCounterBtn" class="modeBtn" onclick="setPotMode('pee','counter')">🔢 Compteur</button><button id="peeStarsBtn" class="modeBtn" onclick="setPotMode('pee','stars')">⭐ Étoiles</button></div><br><b>Caca</b><div class="modeRow"><button id="poopCounterBtn" class="modeBtn" onclick="setPotMode('poop','counter')">🔢 Compteur</button><button id="poopStarsBtn" class="modeBtn" onclick="setPotMode('poop','stars')">⭐ Étoiles</button></div></div><div class="settingGroup"><h3>🧩 Blocs</h3><div id="blockSettings"></div></div><div class="settingGroup"><h3>✅ Missions</h3><div id="taskSettings"></div></div><div class="settingGroup"><button class="btn" onclick="resetSettings()">↩️ Réglages par défaut</button> <button class="btn" onclick="eraseAll()">🗑️ Effacer historique</button></div></section></div></div><script>
const D={morning:{title:'☀️ Le matin',type:'routine',tasks:[['dress','👕','Je m’habille'],['teeth','🪥','Je me brosse les dents'],['breakfast','🥣','Je prends mon petit-déjeuner']]},behaviors:{title:'💛 Mes comportements',type:'behavior',tasks:[['please','🙏','Je dis s’il te plaît'],['thanks','❤️','Je dis merci'],['talk','🗣️','Je parle gentiment'],['help','🤝','J’aide'],['tidy','🧸','Je range mes jouets'],['listen','👂','J’écoute'],['calm','🌬️','Je retrouve mon calme'],['table','🍽️','Je reste bien à table']]},rest:{title:'😴 Temps calme / sieste',type:'behavior',tasks:[['quiet-time','😴','Je respecte le temps calme']]},school:{title:'🎒 École & apprentissage',type:'behavior',tasks:[['homework','📚','Je fais mes activités'],['school-bag','🎒','Je prépare mes affaires'],['apply','✏️','Je m’applique'],['focus','🧠','Je reste concentré'],['reading','📖','Je regarde un livre'],['school-day','🏫','Ma journée à l’école']]},autonomy:{title:'🏠 Autonomie',type:'routine',tasks:[['shoes','👟','Je mets mes chaussures'],['coat','🧥','Je range mon manteau'],['laundry','🧺','Je range mon linge sale'],['clear-table','🥤','Je débarrasse']]},cleanliness:{title:'🚽 La propreté',type:'potty',tasks:[['pot-pee','🚽','Pipi sur le pot'],['pot-poop','🚽','Caca sur le pot']]},evening:{title:'🌙 Le soir',type:'routine',tasks:[['evening-wash','🛁','Je me lave'],['evening-pajamas','🥱','Je mets mon pyjama'],['evening-teeth','🪥','Je me brosse les dents'],['bedtime','🛏️','Je respecte le coucher']]}};
const DB='journeeChampionHistoryV2',CF='journeeChampionConfigV1';let db={days:{}};try{db=JSON.parse(localStorage.getItem(DB))||db}catch(e){}const def={kidMode:false,goalPct:70,reward:'Ma récompense surprise 🎁',pottyMode:{pee:'counter',poop:'counter'},blocks:{morning:true,behaviors:true,rest:true,school:false,autonomy:false,cleanliness:true,evening:true},tasks:{dress:true,teeth:true,breakfast:true,please:true,thanks:true,talk:true,help:true,tidy:true,listen:true,calm:true,table:true,'quiet-time':true,'pot-pee':true,'pot-poop':true,'evening-wash':true,'evening-pajamas':true,'evening-teeth':true,bedtime:true,homework:false,'school-bag':false,apply:false,focus:false,reading:false,'school-day':false,shoes:false,coat:false,laundry:false,'clear-table':false}};let cfg=structuredClone(def);try{let x=JSON.parse(localStorage.getItem(CF));if(x)cfg={...cfg,...x,blocks:{...cfg.blocks,...x.blocks},tasks:{...cfg.tasks,...x.tasks},pottyMode:{...cfg.pottyMode,...x.pottyMode}}}catch(e){}function key(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}const tk=key();db.days[tk]||={state:{},pot:{pee:0,poop:0}};db.days[tk].pot||={pee:0,poop:0};function save(){localStorage.setItem(DB,JSON.stringify(db));localStorage.setItem(CF,JSON.stringify(cfg))}function ids(){let a=[];for(const[k,b]of Object.entries(D))if(cfg.blocks[k])for(const t of b.tasks)if(cfg.tasks[t[0]]!==false&&(b.type!=='potty'||cfg.pottyMode[t[0]==='pot-pee'?'pee':'poop']==='stars'))a.push(t[0]);return a}function score(s){let z=new Set(ids());return Object.entries(s||{}).reduce((n,[k,v])=>n+(z.has(k)?v:0),0)}function mx(){return ids().length*2}function pct(a,b){return b?Math.round(a/b*100):0}
function ncard(t,type){let L=type==='routine'?[['🌟 Fait seul',2,'greatBtn'],['😊 Avec aide',1,'middleBtn'],['🌱 Pas encore',0,'effortBtn']]:[['🌟 Très bien',2,'greatBtn'],['😊 Rappels',1,'middleBtn'],['🌱 Difficile',0,'effortBtn']];return `<div class="task" data-id="${t[0]}"><div class="pic">${t[1]}</div><div><h3>${t[2]}</h3><div class="buttons">${L.map(x=>`<button class="btn ${x[2]}" onclick="mark('${t[0]}',${x[1]},event)">${x[0]}</button>`).join('')}</div></div></div>`}function kcard(t){return `<div class="kidCard" data-id="${t[0]}"><div class="kidEmoji">${t[1]}</div><div class="kidName">${t[2]}</div><div class="kidChoices"><button class="kidChoice kidGreat" onclick="mark('${t[0]}',2,event)">🌟</button><button class="kidChoice kidMid" onclick="mark('${t[0]}',1,event)">😊</button><button class="kidChoice kidTry" onclick="mark('${t[0]}',0,event)">🌱</button></div></div>`}function pcard(t,k,kid){let n=db.days[tk].pot[k]||0;return `<div class="${kid?'kidPot':'potCard'}"><div class="kidEmoji">🚽</div><b>${t[2]}</b><div class="potCount">${n}</div><div class="counter"><button class="minus" onclick="pot('${k}',-1)">−</button><button class="plus" onclick="pot('${k}',1)">+</button></div></div>`}
function renderBlocks(){let h=cfg.kidMode?'<div class="adventure"><div class="avatar">🦁</div>':'';for(const[k,b]of Object.entries(D)){if(!cfg.blocks[k])continue;let a=b.tasks.filter(t=>cfg.tasks[t[0]]!==false);if(!a.length)continue;let cards='';if(b.type==='potty')cards=a.map(t=>{let q=t[0]==='pot-pee'?'pee':'poop';return cfg.pottyMode[q]==='counter'?pcard(t,q,cfg.kidMode):(cfg.kidMode?kcard(t):ncard(t,'behavior'))}).join('');else cards=a.map(t=>cfg.kidMode?kcard(t):ncard(t,b.type)).join('');h+=cfg.kidMode?`<div class="zone"><div class="zoneTitle">${b.title}</div><div class="kidGrid">${cards}</div></div>`:`<section class="box section"><h2>${b.title}</h2><div class="${b.type==='potty'?'potGrid':'grid'}">${cards}</div></section>`}if(cfg.kidMode)h+='<div class="finish">🏰🎁</div></div>';todayBlocks.innerHTML=h}
let lastComplete=false;function render(){document.body.classList.toggle('kid',cfg.kidMode);heroSub.textContent=cfg.kidMode?'🗺️ Avance sur le chemin et gagne tes étoiles !':'On progresse petit à petit. Une journée n’a pas besoin d’être parfaite.';renderBlocks();let s=db.days[tk].state;document.querySelectorAll('[data-id]').forEach(x=>{x.classList.remove('great','middle','effort');let v=s[x.dataset.id];if(v===2)x.classList.add('great');if(v===1)x.classList.add('middle');if(v===0)x.classList.add('effort')});let n=score(s),m=mx(),p=pct(n,m);score.textContent=n;dayMax.textContent=m;bar.style.width=p+'%';todayDate.textContent='📆 '+new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});message.textContent=cfg.kidMode?(p>=80?'🤩 Waouh ! Quelle aventure !':p>=50?'🚀 Tu avances super bien !':'🌟 À toi de jouer !'):(p>=80?'🌟 Super journée !':p>=55?'😊 Une belle journée !':p>=30?'🌱 On progresse !':'💪 Chaque effort compte.');renderWeek();renderSettings();renderTreasure();let complete=ids().length>0&&ids().every(id=>s[id]!==undefined);if(cfg.kidMode&&complete&&!lastComplete)celebrate('🎉 Journée terminée !','Bravo champion !');lastComplete=complete}
function mark(id,v,e){let s=db.days[tk].state,old=s[id];if(old===v)delete s[id];else{s[id]=v;if(cfg.kidMode&&v>0)pop(e,v)}save();render()}function pot(k,d){db.days[tk].pot[k]=Math.max(0,(db.days[tk].pot[k]||0)+d);save();render()}function pop(e,v){if(navigator.vibrate)navigator.vibrate(v===2?35:20);for(let i=0;i<(v===2?7:3);i++){let q=document.createElement('span');q.className='pop';q.textContent=v===2?(i%2?'⭐':'✨'):'😊';q.style.left=(e.clientX+Math.random()*60-30)+'px';q.style.top=e.clientY+'px';document.body.appendChild(q);setTimeout(()=>q.remove(),1100)}}function celebrate(a,b){let q=document.createElement('div');q.className='celebrate';q.innerHTML=`<div>${a}<br><small>${b}</small></div>`;document.body.appendChild(q);setTimeout(()=>q.remove(),1600)}
function mon(d){let x=new Date(d),q=x.getDay()||7;x.setHours(12,0,0,0);x.setDate(x.getDate()-q+1);return x}function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function wd(m){let total=0,pee=0,poop=0;for(let i=0;i<7;i++){let d=db.days[key(add(m,i))];if(d){total+=score(d.state);pee+=d.pot?.pee||0;poop+=d.pot?.poop||0}}return{total,pee,poop}}function renderWeek(){let m=mon(new Date()),d=wd(m),goal=Math.round(mx()*7*cfg.goalPct/100),p=Math.min(100,pct(d.total,goal));weekDates.textContent='Du '+m.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})+' au '+add(m,6).toLocaleDateString('fr-FR',{day:'numeric',month:'long'});weekReward.textContent=d.total>=goal&&goal?'🏆 '+cfg.reward:'🎁 '+cfg.reward+' · encore '+Math.max(0,goal-d.total)+' ⭐';weekBar.style.width=p+'%';weekMessage.textContent=p>=100?'🏆 Trésor débloqué !':p>=70?'🌟 Tu approches du trésor !':'🚀 Continue comme ça !';weekPee.textContent=d.pee;weekPoop.textContent=d.poop;let names=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'],h='';for(let i=0;i<7;i++){let x=add(m,i),k=key(x),pp=pct(score(db.days[k]?.state),mx());h+=`<div class="dayCard ${k===tk?'today':''}"><b>${names[i]}</b><div>${x.getDate()}/${x.getMonth()+1}</div><div style="font-size:20px;font-weight:900">${k>tk?'—':pp+'%'}</div><div>${k>tk?'⏳':pp>=80?'🌟':pp>=55?'😊':pp>=30?'🌱':'💪'}</div></div>`}weekGrid.innerHTML=h;let B=[];let s=db.days[tk].state;if(['dress','teeth','breakfast'].every(x=>s[x]===2))B.push('🌞 Matin de champion');if(s.tidy===2)B.push('🧸 Roi du rangement');if((db.days[tk].pot.pee||0)>=3)B.push('🚽 Champion du pot');let streak=0;for(let i=0;i<7;i++){let dd=db.days[key(add(m,i))];if(dd&&pct(score(dd.state),mx())>=55)streak++;else if(key(add(m,i))<=tk)streak=0}if(streak>=3)B.push('🔥 3 jours de suite');if(ids().every(id=>s[id]!==undefined))B.push('🏅 Journée complète');badges.innerHTML=B.length?B.map(x=>`<span class="badge">${x}</span>`).join(''):'<span class="muted">Les badges apparaîtront avec les réussites ✨</span>'}
function renderTreasure(){if(!cfg.kidMode){kidTreasure.innerHTML='';return}let d=wd(mon(new Date())),g=Math.round(mx()*7*cfg.goalPct/100),p=Math.min(100,pct(d.total,g));kidTreasure.innerHTML=`<div class="kidTreasure"><div class="chest">${p>=100?'🏆':'🎁'}</div><strong>${cfg.reward}</strong><div>${p>=100?'Trésor gagné !':'Encore '+Math.max(0,g-d.total)+' ⭐ avant le trésor'}</div><div class="progress"><div class="bar" style="width:${p}%"></div></div></div>`}
function tog(label,c,fn){return `<div class="toggleRow"><span>${label}</span><label class="switch"><input type="checkbox" ${c?'checked':''} onchange="${fn}"><span class="slider"></span></label></div>`}function renderSettings(){kidModeToggle.checked=cfg.kidMode;rewardInput.value=cfg.reward;goalRange.value=cfg.goalPct;goalValue.textContent=cfg.goalPct;for(const k of ['pee','poop']){document.getElementById(k+'CounterBtn').classList.toggle('active',cfg.pottyMode[k]==='counter');document.getElementById(k+'StarsBtn').classList.toggle('active',cfg.pottyMode[k]==='stars')}blockSettings.innerHTML=Object.entries(D).map(([k,b])=>tog(b.title,cfg.blocks[k],`toggleBlock('${k}',this.checked)`)).join('');taskSettings.innerHTML=Object.values(D).map(b=>`<h4>${b.title}</h4>`+b.tasks.map(t=>tog(t[1]+' '+t[2],cfg.tasks[t[0]]!==false,`toggleTask('${t[0]}',this.checked)`)).join('')).join('')}
let hold;parentFab.addEventListener('touchstart',()=>hold=setTimeout(parentOpen,2000),{passive:true});parentFab.addEventListener('touchend',()=>clearTimeout(hold));parentFab.addEventListener('mousedown',()=>hold=setTimeout(parentOpen,2000));parentFab.addEventListener('mouseup',()=>clearTimeout(hold));function parentOpen(){document.body.classList.remove('kid');showView('settings');celebrate('🔓','Espace parents')}function setKidMode(v){cfg.kidMode=v;save();render();showView('today')}function setPotMode(k,v){cfg.pottyMode[k]=v;save();render()}function toggleBlock(k,v){cfg.blocks[k]=v;save();render()}function toggleTask(k,v){cfg.tasks[k]=v;save();render()}function updateGoal(v){cfg.goalPct=v;save();render()}function updateReward(v){cfg.reward=v||'Ma récompense surprise 🎁';save();render()}function resetToday(){if(confirm('Effacer aujourd’hui ?')){db.days[tk]={state:{},pot:{pee:0,poop:0}};save();render()}}function resetSettings(){if(confirm('Réinitialiser les réglages ?')){cfg=structuredClone(def);save();render()}}function eraseAll(){if(confirm('Effacer tout l’historique ?')){db={days:{[tk]:{state:{},pot:{pee:0,poop:0}}}};save();render()}}function showView(v){['today','week','settings'].forEach(x=>{document.getElementById(x+'View').classList.toggle('active',x===v);document.getElementById(x+'Tab').classList.toggle('active',x===v)});todayHeader.style.display=v==='today'?'block':'none'}save();render();
</script></body></html>
