<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ma semaine de champion</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#fff8dc,#eef7ff,#f5eaff);color:#1f2937}.wrap{max-width:980px;margin:auto;padding:12px}.box{background:#fff;border-radius:24px;padding:17px;margin-bottom:14px;box-shadow:0 8px 28px #0001}.hero{text-align:center}.hero h1{margin:0;font-size:clamp(30px,5vw,48px)}.muted{color:#667085}.tabs{display:flex;gap:6px;background:#eef2f7;padding:6px;border-radius:18px;margin:14px auto;max-width:620px}.tab{flex:1;border:0;background:transparent;border-radius:13px;padding:11px;font-weight:800}.tab.active{background:#fff;color:#2563eb}.view{display:none}.view.active{display:block}.scoreline{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.pill{padding:9px 14px;border-radius:99px;background:#fff1b8;font-weight:850}.date{background:#e0f2fe}.progress{height:17px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:13px auto;max-width:650px}.bar{height:100%;background:linear-gradient(90deg,#facc15,#22c55e)}.message{text-align:center;background:#f8fafc;border-radius:14px;padding:11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.task{border:3px solid #edf1f6;border-radius:21px;padding:12px;display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:center}.task.great{background:#f0fdf4;border-color:#86efac}.task.middle{background:#fffbeb;border-color:#fde68a}.task.effort{background:#f8fafc;border-color:#cbd5e1}.pic{font-size:48px;text-align:center}.task h3{margin:0 0 8px}.buttons{display:flex;gap:5px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:10px;font-weight:800}.greatBtn{background:#dcfce7}.middleBtn{background:#fef3c7}.effortBtn{background:#e2e8f0}.potGrid,.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.potCard,.stat{text-align:center;background:#f8fafc;border-radius:18px;padding:15px}.potCount{font-size:36px;font-weight:900}.counter{display:flex;justify-content:center;gap:10px}.counter button{width:48px;height:43px;border:0;border-radius:13px;font-size:22px}.week{text-align:center}.weekGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:14px}.dayCard{border:2px solid #e5e7eb;border-radius:16px;padding:10px 4px}.reward{background:#fff1b8;padding:14px;border-radius:17px;font-weight:900}.settingGroup{border:1px solid #e5e7eb;border-radius:19px;padding:14px;margin-bottom:13px}.toggleRow{display:flex;justify-content:space-between;align-items:center;padding:9px 0}.switch{position:relative;width:52px;height:30px}.switch input{opacity:0}.slider{position:absolute;inset:0;background:#cbd5e1;border-radius:99px}.slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#22c55e}.switch input:checked+.slider:before{transform:translateX(22px)}.field{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}.modeRow{display:grid;grid-template-columns:1fr 1fr;gap:7px}.modeBtn{border:2px solid #e5e7eb;background:#fff;padding:10px;border-radius:13px}.modeBtn.active{border-color:#60a5fa;background:#eff6ff}.parentFab{display:none;position:fixed;right:14px;bottom:14px;z-index:50;border:0;border-radius:99px;padding:13px 16px;background:#fffffff0;box-shadow:0 4px 18px #0002;font-size:18px;font-weight:850;-webkit-user-select:none;user-select:none;touch-action:manipulation}body.kid{background:linear-gradient(#7dd8ff,#dff7ff 18%,#fff6c9 48%,#dff5c9)}body.kid .tabs{display:none}body.kid .date,body.kid #dayMax,body.kid .slashMax,body.kid .footer{display:none}body.kid .parentFab{display:block}.kidTreasure{background:linear-gradient(135deg,#fff4a8,#ffd36c);border:4px solid #fff;border-radius:28px;padding:16px;text-align:center;margin-bottom:18px}.chest{font-size:56px}.adventure{position:relative}.adventure:before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:12px;background:repeating-linear-gradient(#fff 0 18px,#f5c542 18px 36px);border-radius:99px}.zone{position:relative;margin:22px 0 34px}.zoneTitle{display:table;position:relative;margin:auto auto 16px;background:#fff;border-radius:99px;padding:10px 20px;font-size:23px;font-weight:950}.kidGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;position:relative}.kidCard,.kidPot{background:#fff;border:5px solid #fff;border-radius:30px;padding:15px;text-align:center}.kidCard.great{background:#eaffea;border-color:#72df7d}.kidCard.middle{background:#fff7cf;border-color:#ffd54f}.kidCard.effort{background:#f5f6f7;border-color:#d6dbe1}.kidEmoji{font-size:65px}.kidName{font-size:20px;font-weight:950;margin:5px 0 12px}.kidChoices{display:flex;justify-content:center;gap:7px}.kidChoice{width:60px;height:54px;border:0;border-radius:18px;font-size:26px}.kidGreat{background:#bdf5c5}.kidMid{background:#ffe894}.kidTry{background:#e4e8ed}.avatar,.finish{text-align:center;font-size:55px;position:relative}.pinOverlay{display:none;position:fixed;inset:0;z-index:1000;background:#0008;align-items:center;justify-content:center;padding:18px}.pinOverlay.open{display:flex}.pinBox{width:min(360px,100%);background:#fff;border-radius:30px;padding:22px;text-align:center}.pinDots{display:flex;justify-content:center;gap:12px;margin:20px}.pinDot{width:17px;height:17px;border:2px solid #94a3b8;border-radius:50%}.pinDot.on{background:#2563eb;border-color:#2563eb}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.key{height:60px;border:0;border-radius:18px;background:#f1f5f9;font-size:25px;font-weight:900}.pinError{height:22px;color:#dc2626;font-weight:800}.hint{font-size:12px;color:#64748b}@media(max-width:700px){.grid{grid-template-columns:1fr}.weekGrid{grid-template-columns:repeat(4,1fr)}.kidGrid{gap:10px}}@media(max-width:430px){.kidGrid,.potGrid,.stats{grid-template-columns:1fr}}</style></head><body><button class="parentFab" onclick="openPin()">🔒 Parents</button><div id="pinOverlay" class="pinOverlay"><div class="pinBox"><h2>🔒 Espace parents</h2><div>Entre le code à 4 chiffres</div><div class="pinDots" id="pinDots"></div><div class="pinError" id="pinError"></div><div class="keypad" id="keypad"></div><button class="btn" onclick="closePin()">Annuler</button></div></div><div class="wrap"><section class="box hero"><h1>🌈 Ma semaine de champion</h1><p class="muted" id="heroSub"></p><div class="tabs"><button class="tab active" id="todayTab" onclick="showView('today')">☀️ Aujourd'hui</button><button class="tab" id="weekTab" onclick="showView('week')">📅 Ma semaine</button><button class="tab" id="settingsTab" onclick="showView('settings')">⚙️ Paramètres</button></div><div id="todayHeader"><div class="scoreline"><div class="pill date" id="todayDate"></div><div class="pill">⭐ <span id="scoreEl">0</span><span class="slashMax"> / </span><span id="dayMax">0</span></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="message" id="message"></div></div></section><div id="todayView" class="view active"><div id="kidTreasure"></div><div id="todayBlocks"></div><section class="box footer"><button class="btn" onclick="resetToday()">🧹 Effacer aujourd'hui</button></section></div><div id="weekView" class="view"><section class="box week"><h2>📅 Ma semaine</h2><div id="weekDates"></div><div class="reward" id="weekReward"></div><div class="progress"><div class="bar" id="weekBar"></div></div><div class="weekGrid" id="weekGrid"></div><div class="stats"><div class="stat">🚽 Pipi <b id="weekPee"></b></div><div class="stat">🚽 Caca <b id="weekPoop"></b></div></div></section></div><div id="settingsView" class="view"><section class="box"><h2>⚙️ Paramètres parents</h2><div class="settingGroup"><h3>🎮 Mode Enfant ludique</h3><div class="toggleRow"><span>Activer l'aventure enfant</span><label class="switch"><input id="kidModeToggle" type="checkbox" onchange="setKidMode(this.checked)"><span class="slider"></span></label></div></div><div class="settingGroup"><h3>🔐 Code parent</h3><input class="field" id="newPin" inputmode="numeric" maxlength="4" type="password" placeholder="Nouveau code"><button class="btn greatBtn" onclick="changePin()">Enregistrer</button><div class="hint">Code par défaut : 0000</div><div id="pinChangeMsg"></div></div><div class="settingGroup"><h3>🎯 Récompense</h3><input class="field" id="rewardInput" oninput="cfg.reward=this.value;save();render()"><br><br><label>Objectif : <b><span id="goalValue"></span>%</b></label><input id="goalRange" style="width:100%" type="range" min="50" max="90" step="5" oninput="cfg.goalPct=+this.value;save();render()"></div><div class="settingGroup"><h3>🚽 Propreté</h3><b>Pipi</b><div class="modeRow"><button id="peeCounterBtn" class="modeBtn" onclick="setPotMode('pee','counter')">🔢 Compteur</button><button id="peeStarsBtn" class="modeBtn" onclick="setPotMode('pee','stars')">⭐ Étoiles</button></div><br><b>Caca</b><div class="modeRow"><button id="poopCounterBtn" class="modeBtn" onclick="setPotMode('poop','counter')">🔢 Compteur</button><button id="poopStarsBtn" class="modeBtn" onclick="setPotMode('poop','stars')">⭐ Étoiles</button></div></div><div class="settingGroup"><h3>🧩 Blocs</h3><div id="blockSettings"></div></div><div class="settingGroup"><h3>✅ Missions</h3><div id="taskSettings"></div></div></section></div></div><script>const D={morning:['☀️ Le matin','routine',[['dress','👕','Je m’habille'],['teeth','🪥','Je me brosse les dents'],['breakfast','🥣','Je prends mon petit-déjeuner']]],behaviors:['💛 Mes comportements','behavior',[['please','🙏','Je dis s’il te plaît'],['thanks','❤️','Je dis merci'],['talk','🗣️','Je parle gentiment'],['help','🤝','J’aide'],['tidy','🧸','Je range mes jouets'],['listen','👂','J’écoute'],['calm','🌬️','Je retrouve mon calme'],['table','🍽️','Je reste bien à table']]],rest:['😴 Temps calme / sieste','behavior',[['quiet-time','😴','Je respecte le temps calme']]],school:['🎒 École & apprentissage','behavior',[['homework','📚','Je fais mes activités'],['school-bag','🎒','Je prépare mes affaires'],['apply','✏️','Je m’applique'],['focus','🧠','Je reste concentré'],['reading','📖','Je regarde un livre'],['school-day','🏫','Ma journée à l’école']]],autonomy:['🏠 Autonomie','routine',[['shoes','👟','Je mets mes chaussures'],['coat','🧥','Je range mon manteau'],['laundry','🧺','Je range mon linge sale'],['clear-table','🥤','Je débarrasse']]],cleanliness:['🚽 La propreté','potty',[['pot-pee','🚽','Pipi sur le pot'],['pot-poop','🚽','Caca sur le pot']]],evening:['🌙 Le soir','routine',[['evening-wash','🛁','Je me lave'],['evening-pajamas','🥱','Je mets mon pyjama'],['evening-teeth','🪥','Je me brosse les dents'],['bedtime','🛏️','Je respecte le coucher']]]};const DB='journeeChampionHistoryV2',CF='journeeChampionConfigV1',def={kidMode:false,parentPin:'0000',goalPct:70,reward:'Ma récompense surprise 🎁',pottyMode:{pee:'counter',poop:'counter'},blocks:{morning:true,behaviors:true,rest:true,school:false,autonomy:false,cleanliness:true,evening:true},tasks:{}};Object.values(D).forEach(b=>b[2].forEach(t=>def.tasks[t[0]]=!['homework','school-bag','apply','focus','reading','school-day','shoes','coat','laundry','clear-table'].includes(t[0])));let cfg=JSON.parse(localStorage.getItem(CF)||'null')||structuredClone(def);cfg={...def,...cfg,blocks:{...def.blocks,...cfg.blocks},tasks:{...def.tasks,...cfg.tasks},pottyMode:{...def.pottyMode,...cfg.pottyMode}};let db=JSON.parse(localStorage.getItem(DB)||'{"days":{}}');function key(d=new Date()){return d.toLocaleDateString('en-CA')}const tk=key();db.days[tk]||={state:{},pot:{pee:0,poop:0}};db.days[tk].pot||={pee:0,poop:0};const save=()=>{localStorage.setItem(DB,JSON.stringify(db));localStorage.setItem(CF,JSON.stringify(cfg))};function ids(){let a=[];Object.entries(D).forEach(([k,b])=>{if(cfg.blocks[k])b[2].forEach(t=>{let q=t[0]==='pot-pee'?'pee':'poop';if(cfg.tasks[t[0]]!==false&&(b[1]!=='potty'||cfg.pottyMode[q]==='stars'))a.push(t[0])})});return a}function sc(s){let z=new Set(ids());return Object.entries(s||{}).reduce((n,[k,v])=>n+(z.has(k)?v:0),0)}const mx=()=>ids().length*2,pct=(a,b)=>b?Math.round(a/b*100):0;function card(t,kid,type){if(kid)return `<div class="kidCard" data-id="${t[0]}"><div class="kidEmoji">${t[1]}</div><div class="kidName">${t[2]}</div><div class="kidChoices"><button class="kidChoice kidGreat" onclick="mark('${t[0]}',2)">🌟</button><button class="kidChoice kidMid" onclick="mark('${t[0]}',1)">😊</button><button class="kidChoice kidTry" onclick="mark('${t[0]}',0)">🌱</button></div></div>`;return `<div class="task" data-id="${t[0]}"><div class="pic">${t[1]}</div><div><h3>${t[2]}</h3><div class="buttons"><button class="btn greatBtn" onclick="mark('${t[0]}',2)">🌟 Très bien</button><button class="btn middleBtn" onclick="mark('${t[0]}',1)">😊 Moyen</button><button class="btn effortBtn" onclick="mark('${t[0]}',0)">🌱 Difficile</button></div></div></div>`}function potty(t,kid){let q=t[0]==='pot-pee'?'pee':'poop';if(cfg.pottyMode[q]==='stars')return card(t,kid,'behavior');return `<div class="${kid?'kidPot':'potCard'}"><div class="kidEmoji">🚽</div><b>${t[2]}</b><div class="potCount">${db.days[tk].pot[q]||0}</div><div class="counter"><button onclick="pot('${q}',-1)">−</button><button onclick="pot('${q}',1)">+</button></div></div>`}function renderBlocks(){let h=cfg.kidMode?'<div class="adventure"><div class="avatar">🦁</div>':'';Object.entries(D).forEach(([k,b])=>{if(!cfg.blocks[k])return;let a=b[2].filter(t=>cfg.tasks[t[0]]!==false);if(!a.length)return;let c=a.map(t=>b[1]==='potty'?potty(t,cfg.kidMode):card(t,cfg.kidMode,b[1])).join('');h+=cfg.kidMode?`<div class="zone"><div class="zoneTitle">${b[0]}</div><div class="kidGrid">${c}</div></div>`:`<section class="box"><h2>${b[0]}</h2><div class="${b[1]==='potty'?'potGrid':'grid'}">${c}</div></section>`});if(cfg.kidMode)h+='<div class="finish">🏰🎁</div></div>';todayBlocks.innerHTML=h}function mark(id,v){let s=db.days[tk].state;s[id]===v?delete s[id]:s[id]=v;save();render()}function pot(q,d){db.days[tk].pot[q]=Math.max(0,(db.days[tk].pot[q]||0)+d);save();render()}function mon(){let d=new Date(),q=d.getDay()||7;d.setDate(d.getDate()-q+1);return d}function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function week(){let m=mon(),total=0,pee=0,poop=0;for(let i=0;i<7;i++){let d=db.days[key(add(m,i))];if(d){total+=sc(d.state);pee+=d.pot?.pee||0;poop+=d.pot?.poop||0}}return{m,total,pee,poop}}function renderWeek(){let w=week(),g=Math.round(mx()*7*cfg.goalPct/100);weekDates.textContent='Du '+w.m.toLocaleDateString('fr-FR')+' au '+add(w.m,6).toLocaleDateString('fr-FR');weekReward.textContent=w.total>=g?'🏆 '+cfg.reward:'🎁 '+cfg.reward+' · encore '+Math.max(0,g-w.total)+' ⭐';weekBar.style.width=Math.min(100,pct(w.total,g))+'%';weekPee.textContent=w.pee;weekPoop.textContent=w.poop;let n=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];weekGrid.innerHTML=n.map((x,i)=>{let d=add(w.m,i),p=pct(sc(db.days[key(d)]?.state),mx());return `<div class="dayCard"><b>${x}</b><div>${p}%</div><div>${p>=80?'🌟':p>=55?'😊':p>=30?'🌱':'💪'}</div></div>`}).join('')}function renderTreasure(){if(!cfg.kidMode){kidTreasure.innerHTML='';return}let w=week(),g=Math.round(mx()*7*cfg.goalPct/100);kidTreasure.innerHTML=`<div class="kidTreasure"><div class="chest">🎁</div><b>${cfg.reward}</b><div>Encore ${Math.max(0,g-w.total)} ⭐ avant le trésor</div></div>`}function tog(l,c,f){return `<div class="toggleRow"><span>${l}</span><label class="switch"><input type="checkbox" ${c?'checked':''} onchange="${f}"><span class="slider"></span></label></div>`}function renderSettings(){kidModeToggle.checked=cfg.kidMode;rewardInput.value=cfg.reward;goalRange.value=cfg.goalPct;goalValue.textContent=cfg.goalPct;['pee','poop'].forEach(k=>{document.getElementById(k+'CounterBtn').classList.toggle('active',cfg.pottyMode[k]==='counter');document.getElementById(k+'StarsBtn').classList.toggle('active',cfg.pottyMode[k]==='stars')});blockSettings.innerHTML=Object.entries(D).map(([k,b])=>tog(b[0],cfg.blocks[k],`cfg.blocks['${k}']=this.checked;save();render()`)).join('');taskSettings.innerHTML=Object.values(D).map(b=>'<h4>'+b[0]+'</h4>'+b[2].map(t=>tog(t[1]+' '+t[2],cfg.tasks[t[0]]!==false,`cfg.tasks['${t[0]}']=this.checked;save();render()`)).join('')).join('')}function render(){document.body.classList.toggle('kid',cfg.kidMode);heroSub.textContent=cfg.kidMode?'🗺️ En route vers le trésor !':'On progresse petit à petit.';renderBlocks();let s=db.days[tk].state;document.querySelectorAll('[data-id]').forEach(x=>{let v=s[x.dataset.id];x.classList.toggle('great',v===2);x.classList.toggle('middle',v===1);x.classList.toggle('effort',v===0)});let n=sc(s),m=mx(),p=pct(n,m);scoreEl.textContent=n;dayMax.textContent=m;bar.style.width=p+'%';todayDate.textContent='📆 '+new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});message.textContent=p>=80?'🌟 Super journée !':p>=55?'😊 Belle journée !':'🌱 On progresse !';renderWeek();renderSettings();renderTreasure()}function setKidMode(v){cfg.kidMode=v;save();render();showView('today')}function setPotMode(k,v){cfg.pottyMode[k]=v;save();render()}function showView(v){['today','week','settings'].forEach(x=>{document.getElementById(x+'View').classList.toggle('active',x===v);document.getElementById(x+'Tab').classList.toggle('active',x===v)});todayHeader.style.display=v==='today'?'block':'none'}function resetToday(){if(confirm('Effacer aujourd’hui ?')){db.days[tk]={state:{},pot:{pee:0,poop:0}};save();render()}}let pe='';function drawPin(){pinDots.innerHTML=[0,1,2,3].map((_,i)=>`<i class="pinDot ${i<pe.length?'on':''}"></i>`).join('')}function openPin(){pe='';pinError.textContent='';drawPin();pinOverlay.classList.add('open')}function closePin(){pinOverlay.classList.remove('open')}function press(n){pe+=n;drawPin();if(pe.length===4){if(pe===String(cfg.parentPin||'0000')){closePin();document.body.classList.remove('kid');showView('settings')}else{pinError.textContent='❌ Code incorrect';pe='';drawPin()}}}function back(){pe=pe.slice(0,-1);drawPin()}keypad.innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="press('${n}')">${n}</button>`).join('')+`<button class="key" onclick="back()">⌫</button><button class="key" onclick="press('0')">0</button><button class="key" onclick="closePin()">✕</button>`;function changePin(){let v=newPin.value.replace(/\D/g,'');if(v.length!==4){pinChangeMsg.textContent='❌ 4 chiffres obligatoires';return}cfg.parentPin=v;newPin.value='';pinChangeMsg.textContent='✅ Code modifié';save()}save();render();</script></body></html>
