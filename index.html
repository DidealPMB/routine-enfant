<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ma semaine de champion</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#fff8dc,#eef7ff,#f5eaff);color:#1f2937}.wrap{max-width:980px;margin:auto;padding:12px}.box{background:#fff;border-radius:24px;padding:17px;margin-bottom:14px;box-shadow:0 8px 28px #0001}.hero{text-align:center}.hero h1{margin:0;font-size:clamp(30px,5vw,48px)}.muted{color:#667085}.tabs{display:flex;gap:6px;background:#eef2f7;padding:6px;border-radius:18px;margin:14px auto;max-width:620px}.tab{flex:1;border:0;background:transparent;border-radius:13px;padding:11px;font-weight:800}.tab.active{background:#fff;color:#2563eb}.view{display:none}.view.active{display:block}.scoreline{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.pill{padding:9px 14px;border-radius:99px;background:#fff1b8;font-weight:850}.date{background:#e0f2fe}.progress{height:17px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:13px auto;max-width:650px}.bar{height:100%;background:linear-gradient(90deg,#facc15,#22c55e);transition:.25s}.message{text-align:center;background:#f8fafc;border-radius:14px;padding:11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.task{border:3px solid #edf1f6;border-radius:21px;padding:12px;display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:center;transition:.2s}.task.great{background:#f0fdf4;border-color:#86efac}.task.middle{background:#fffbeb;border-color:#fde68a}.task.effort{background:#f8fafc;border-color:#cbd5e1}.pic{font-size:48px;text-align:center}.task h3{margin:0 0 8px}.buttons{display:flex;gap:5px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:10px;font-weight:800;touch-action:manipulation}.greatBtn{background:#dcfce7}.middleBtn{background:#fef3c7}.effortBtn{background:#e2e8f0}.potGrid,.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.potCard,.stat{text-align:center;background:#f8fafc;border-radius:18px;padding:15px}.potCount{font-size:36px;font-weight:900}.counter{display:flex;justify-content:center;gap:10px}.counter button{width:48px;height:43px;border:0;border-radius:13px;font-size:22px}.week{text-align:center}.weekGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:14px}.dayCard{border:2px solid #e5e7eb;border-radius:16px;padding:10px 4px}.reward{background:#fff1b8;padding:14px;border-radius:17px;font-weight:900}.settingGroup{border:1px solid #e5e7eb;border-radius:19px;padding:14px;margin-bottom:13px}.toggleRow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;gap:10px}.switch{position:relative;width:52px;height:30px;flex:none}.switch input{opacity:0}.slider{position:absolute;inset:0;background:#cbd5e1;border-radius:99px}.slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#22c55e}.switch input:checked+.slider:before{transform:translateX(22px)}.field{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}.modeRow{display:grid;grid-template-columns:1fr 1fr;gap:7px}.modeBtn{border:2px solid #e5e7eb;background:#fff;padding:10px;border-radius:13px}.modeBtn.active{border-color:#60a5fa;background:#eff6ff}.parentFab{display:none;position:fixed;right:14px;bottom:14px;z-index:50;border:0;border-radius:99px;padding:13px 16px;background:#fffffff0;box-shadow:0 4px 18px #0002;font-size:18px;font-weight:850;user-select:none;touch-action:manipulation}
body.kid{background:linear-gradient(#7dd8ff,#dff7ff 18%,#fff6c9 48%,#dff5c9)}body.kid .tabs{display:none}body.kid .date,body.kid #dayMax,body.kid .slashMax,body.kid .footer{display:none}body.kid .parentFab{display:block}.kidTreasure{background:linear-gradient(135deg,#fff4a8,#ffd36c);border:4px solid #fff;border-radius:28px;padding:16px;text-align:center;margin-bottom:18px}.chest{font-size:56px}.adventure{position:relative}.adventure:before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:12px;background:repeating-linear-gradient(#fff 0 18px,#f5c542 18px 36px);border-radius:99px}.zone{position:relative;margin:22px 0 34px}.zoneTitle{display:table;position:relative;margin:auto auto 16px;background:#fff;border-radius:99px;padding:10px 20px;font-size:23px;font-weight:950}.kidGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;position:relative}.kidCard,.kidPot{background:#fff;border:5px solid #fff;border-radius:30px;padding:15px;text-align:center;transition:.2s}.kidCard.great{background:#eaffea;border-color:#72df7d}.kidCard.middle{background:#fff7cf;border-color:#ffd54f}.kidCard.effort{background:#f5f6f7;border-color:#d6dbe1}.kidEmoji{font-size:65px}.kidName{font-size:20px;font-weight:950;margin:5px 0 12px}.kidChoices{display:flex;justify-content:center;gap:7px}.kidChoice{width:60px;height:54px;border:0;border-radius:18px;font-size:26px;touch-action:manipulation}.kidGreat{background:#bdf5c5}.kidMid{background:#ffe894}.kidTry{background:#e4e8ed}.avatar,.finish{text-align:center;font-size:55px;position:relative}.pinOverlay{display:none;position:fixed;inset:0;z-index:1000;background:#0008;align-items:center;justify-content:center;padding:18px}.pinOverlay.open{display:flex}.pinBox{width:min(360px,100%);background:#fff;border-radius:30px;padding:22px;text-align:center}.pinDots{display:flex;justify-content:center;gap:12px;margin:20px}.pinDot{width:17px;height:17px;border:2px solid #94a3b8;border-radius:50%}.pinDot.on{background:#2563eb;border-color:#2563eb}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.key{height:60px;border:0;border-radius:18px;background:#f1f5f9;font-size:25px;font-weight:900}.pinError{height:22px;color:#dc2626;font-weight:800}.hint{font-size:12px;color:#64748b}
.fx{position:fixed;z-index:2000;pointer-events:none;font-size:32px;animation:fly 900ms ease-out forwards}.cardPulse{animation:pulseCard 420ms ease}.cloudPuff{animation:cloudCard 500ms ease}@keyframes fly{0%{transform:translate(0,0) scale(.7);opacity:1}100%{transform:translate(var(--dx),-120px) scale(1.35) rotate(var(--r));opacity:0}}@keyframes pulseCard{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}@keyframes cloudCard{0%{transform:scale(1)}35%{transform:scale(.97)}70%{transform:scale(1.03)}100%{transform:scale(1)}}
@media(max-width:700px){.grid{grid-template-columns:1fr}.weekGrid{grid-template-columns:repeat(4,1fr)}.kidGrid{gap:10px}}@media(max-width:430px){.kidGrid,.potGrid,.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<button class="parentFab" onclick="openPin()">🔒 Parents</button>
<div id="pinOverlay" class="pinOverlay"><div class="pinBox"><h2>🔒 Espace parents</h2><div>Entre le code à 4 chiffres</div><div class="pinDots" id="pinDots"></div><div class="pinError" id="pinError"></div><div class="keypad" id="keypad"></div><button class="btn" onclick="closePin()">Annuler</button></div></div>
<div class="wrap">
<section class="box hero"><h1>🌈 Ma semaine de champion</h1><p class="muted" id="heroSub"></p><div class="tabs"><button class="tab active" id="todayTab" onclick="showView('today')">☀️ Aujourd'hui</button><button class="tab" id="weekTab" onclick="showView('week')">📅 Ma semaine</button><button class="tab" id="settingsTab" onclick="showView('settings')">⚙️ Paramètres</button></div><div id="todayHeader"><div class="scoreline"><div class="pill date" id="todayDate"></div><div class="pill">⭐ <span id="scoreEl">0</span><span class="slashMax"> / </span><span id="dayMax">0</span></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="message" id="message"></div></div></section>
<div id="todayView" class="view active"><div id="kidTreasure"></div><div id="todayBlocks"></div><section class="box footer"><button class="btn" onclick="resetToday()">🧹 Effacer aujourd'hui</button></section></div>
<div id="weekView" class="view"><section class="box week"><h2>📅 Ma semaine</h2><div id="weekDates"></div><div class="reward" id="weekReward"></div><div class="progress"><div class="bar" id="weekBar"></div></div><div class="weekGrid" id="weekGrid"></div><div class="stats"><div class="stat">🚽 Pipi <b id="weekPee"></b></div><div class="stat">🚽 Caca <b id="weekPoop"></b></div></div></section></div>
<div id="settingsView" class="view"><section class="box"><h2>⚙️ Paramètres parents</h2><div class="settingGroup"><h3>🎮 Mode Enfant ludique</h3><div class="toggleRow"><span>Activer l'aventure enfant</span><label class="switch"><input id="kidModeToggle" type="checkbox" onchange="setKidMode(this.checked)"><span class="slider"></span></label></div></div><div class="settingGroup"><h3>🔐 Code parent</h3><input class="field" id="newPin" inputmode="numeric" maxlength="4" type="password" placeholder="Nouveau code"><button class="btn greatBtn" onclick="changePin()">Enregistrer</button><div class="hint">Code par défaut : 0000</div><div id="pinChangeMsg"></div></div><div class="settingGroup"><h3>🎯 Récompense</h3><input class="field" id="rewardInput" oninput="cfg.reward=this.value;save();render()"><br><br><label>Objectif : <b><span id="goalValue"></span>%</b></label><input id="goalRange" style="width:100%" type="range" min="50" max="90" step="5" oninput="cfg.goalPct=+this.value;save();render()"></div><div class="settingGroup"><h3>🚽 Propreté</h3><b>Pipi</b><div class="modeRow"><button id="peeCounterBtn" class="modeBtn" onclick="setPotMode('pee','counter')">🔢 Compteur</button><button id="peeStarsBtn" class="modeBtn" onclick="setPotMode('pee','stars')">⭐ Étoiles</button></div><br><b>Caca</b><div class="modeRow"><button id="poopCounterBtn" class="modeBtn" onclick="setPotMode('poop','counter')">🔢 Compteur</button><button id="poopStarsBtn" class="modeBtn" onclick="setPotMode('poop','stars')">⭐ Étoiles</button></div></div><div class="settingGroup"><h3>🧩 Blocs</h3><div id="blockSettings"></div></div><div class="settingGroup"><h3>✅ Missions</h3><div id="taskSettings"></div></div></section></div>
</div>
<script>
const D={morning:['☀️ Le matin','routine',[['dress','👕','Je m’habille'],['teeth','🪥','Je me brosse les dents'],['breakfast','🥣','Je prends mon petit-déjeuner']]],behaviors:['💛 Mes comportements','behavior',[['please','🙏','Je dis s’il te plaît'],['thanks','❤️','Je dis merci'],['talk','🗣️','Je parle gentiment'],['help','🤝','J’aide'],['tidy','🧸','Je range mes jouets'],['listen','👂','J’écoute'],['calm','🌬️','Je retrouve mon calme'],['table','🍽️','Je reste bien à table']]],rest:['😴 Temps calme / sieste','behavior',[['quiet-time','😴','Je respecte le temps calme']]],school:['🎒 École & apprentissage','behavior',[['homework','📚','Je fais mes activités'],['school-bag','🎒','Je prépare mes affaires'],['apply','✏️','Je m’applique'],['focus','🧠','Je reste concentré'],['reading','📖','Je regarde un livre'],['school-day','🏫','Ma journée à l’école']]],autonomy:['🏠 Autonomie','routine',[['shoes','👟','Je mets mes chaussures'],['coat','🧥','Je range mon manteau'],['laundry','🧺','Je range mon linge sale'],['clear-table','🥤','Je débarrasse']]],cleanliness:['🚽 La propreté','potty',[['pot-pee','🚽','Pipi sur le pot'],['pot-poop','🚽','Caca sur le pot']]],evening:['🌙 Le soir','routine',[['evening-wash','🛁','Je me lave'],['evening-pajamas','🥱','Je mets mon pyjama'],['evening-teeth','🪥','Je me brosse les dents'],['bedtime','🛏️','Je respecte le coucher']]]};
const DB='journeeChampionHistoryV2',CF='journeeChampionConfigV1';
const def={kidMode:false,parentPin:'0000',goalPct:70,reward:'Ma récompense surprise 🎁',pottyMode:{pee:'counter',poop:'counter'},blocks:{morning:true,behaviors:true,rest:true,school:false,autonomy:false,cleanliness:true,evening:true},tasks:{}};
Object.values(D).forEach(b=>b[2].forEach(t=>def.tasks[t[0]]=!['homework','school-bag','apply','focus','reading','school-day','shoes','coat','laundry','clear-table'].includes(t[0])));
let cfg=JSON.parse(localStorage.getItem(CF)||'null')||structuredClone(def);cfg={...def,...cfg,blocks:{...def.blocks,...cfg.blocks},tasks:{...def.tasks,...cfg.tasks},pottyMode:{...def.pottyMode,...cfg.pottyMode}};
let db=JSON.parse(localStorage.getItem(DB)||'{"days":{}}');function key(d=new Date()){return d.toLocaleDateString('en-CA')}const tk=key();db.days[tk]||={state:{},pot:{pee:0,poop:0}};db.days[tk].pot||={pee:0,poop:0};const save=()=>{localStorage.setItem(DB,JSON.stringify(db));localStorage.setItem(CF,JSON.stringify(cfg))};
function ids(){let a=[];Object.entries(D).forEach(([k,b])=>{if(cfg.blocks[k])b[2].forEach(t=>{let q=t[0]==='pot-pee'?'pee':'poop';if(cfg.tasks[t[0]]!==false&&(b[1]!=='potty'||cfg.pottyMode[q]==='stars'))a.push(t[0])})});return a}function sc(s){let z=new Set(ids());return Object.entries(s||{}).reduce((n,[k,v])=>n+(z.has(k)?v:0),0)}const mx=()=>ids().length*2,pct=(a,b)=>b?Math.round(a/b*100):0;
function card(t,kid,type){if(kid)return `<div class="kidCard" data-id="${t[0]}"><div class="kidEmoji">${t[1]}</div><div class="kidName">${t[2]}</div><div class="kidChoices"><button class="kidChoice kidGreat" onclick="mark('${t[0]}',2,event)">🌟</button><button class="kidChoice kidMid" onclick="mark('${t[0]}',1,event)">😊</button><button class="kidChoice kidTry" onclick="mark('${t[0]}',0,event)">☁️</button></div></div>`;let L=type==='routine'?[['🌟 Fait seul',2,'greatBtn'],['😊 Avec aide',1,'middleBtn'],['☁️ Pas encore',0,'effortBtn']]:[['🌟 Très bien',2,'greatBtn'],['😊 Rappels',1,'middleBtn'],['☁️ Difficile',0,'effortBtn']];return `<div class="task" data-id="${t[0]}"><div class="pic">${t[1]}</div><div><h3>${t[2]}</h3><div class="buttons">${L.map(x=>`<button class="btn ${x[2]}" onclick="mark('${t[0]}',${x[1]},event)">${x[0]}</button>`).join('')}</div></div></div>`}
function pcard(t,k,kid){let n=db.days[tk].pot[k]||0;return `<div class="${kid?'kidPot':'potCard'}"><div class="kidEmoji">🚽</div><b>${t[2]}</b><div class="potCount">${n}</div><div class="counter"><button onclick="pot('${k}',-1,event)">−</button><button onclick="pot('${k}',1,event)">+</button></div></div>`}
function renderBlocks(){let h=cfg.kidMode?'<div class="adventure"><div class="avatar">🦁</div>':'';for(const[k,b]of Object.entries(D)){if(!cfg.blocks[k])continue;let a=b[2].filter(t=>cfg.tasks[t[0]]!==false);if(!a.length)continue;let cards='';if(b[1]==='potty')cards=a.map(t=>{let q=t[0]==='pot-pee'?'pee':'poop';return cfg.pottyMode[q]==='counter'?pcard(t,q,cfg.kidMode):card(t,cfg.kidMode,'behavior')}).join('');else cards=a.map(t=>card(t,cfg.kidMode,b[1])).join('');h+=cfg.kidMode?`<div class="zone"><div class="zoneTitle">${b[0]}</div><div class="kidGrid">${cards}</div></div>`:`<section class="box"><h2>${b[0]}</h2><div class="${b[1]==='potty'?'potGrid':'grid'}">${cards}</div></section>`}if(cfg.kidMode)h+='<div class="finish">🏰🎁</div></div>';todayBlocks.innerHTML=h}
function clickFx(e,v){const card=e.target.closest('[data-id]');if(card){card.classList.remove('cardPulse','cloudPuff');void card.offsetWidth;card.classList.add(v===0?'cloudPuff':'cardPulse')}const chars=v===2?['⭐','✨','⭐','✨','⭐','🎉']:v===1?['😊','✨','😊']:['☁️','☁️','💨'];chars.forEach((c,i)=>{let s=document.createElement('span');s.className='fx';s.textContent=c;s.style.left=(e.clientX-15)+'px';s.style.top=(e.clientY-15)+'px';s.style.setProperty('--dx',(Math.random()*100-50)+'px');s.style.setProperty('--r',(Math.random()*50-25)+'deg');s.style.animationDelay=(i*35)+'ms';document.body.appendChild(s);setTimeout(()=>s.remove(),1100)});if(navigator.vibrate)navigator.vibrate(v===2?[25,30,25]:20)}
function mark(id,v,e){let s=db.days[tk].state;if(s[id]===v)delete s[id];else{s[id]=v;clickFx(e,v)}save();render()}function pot(k,d,e){db.days[tk].pot[k]=Math.max(0,(db.days[tk].pot[k]||0)+d);if(e)clickFx(e,d>0?1:0);save();render()}
function mon(d){let x=new Date(d),q=x.getDay()||7;x.setHours(12,0,0,0);x.setDate(x.getDate()-q+1);return x}function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function wd(m){let total=0,pee=0,poop=0;for(let i=0;i<7;i++){let d=db.days[key(add(m,i))];if(d){total+=sc(d.state);pee+=d.pot?.pee||0;poop+=d.pot?.poop||0}}return{total,pee,poop}}
function render(){document.body.classList.toggle('kid',cfg.kidMode);heroSub.textContent=cfg.kidMode?'🗺️ Avance sur le chemin et gagne tes étoiles !':'On progresse petit à petit.';renderBlocks();let s=db.days[tk].state;document.querySelectorAll('[data-id]').forEach(x=>{x.classList.remove('great','middle','effort');let v=s[x.dataset.id];if(v===2)x.classList.add('great');if(v===1)x.classList.add('middle');if(v===0)x.classList.add('effort')});let n=sc(s),m=mx(),p=pct(n,m);scoreEl.textContent=n;dayMax.textContent=m;bar.style.width=p+'%';todayDate.textContent='📆 '+new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});message.textContent=cfg.kidMode?(p>=80?'🤩 Waouh ! Quelle aventure !':p>=50?'🚀 Tu avances super bien !':'🌟 À toi de jouer !'):(p>=80?'🌟 Super journée !':p>=55?'😊 Une belle journée !':p>=30?'☁️ On continue tranquillement.':'☁️ Chaque effort compte.');renderWeek();renderSettings();renderTreasure()}
function renderWeek(){let m=mon(new Date()),d=wd(m),goal=Math.round(mx()*7*cfg.goalPct/100),p=Math.min(100,pct(d.total,goal));weekDates.textContent='Du '+m.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})+' au '+add(m,6).toLocaleDateString('fr-FR',{day:'numeric',month:'long'});weekReward.textContent=d.total>=goal&&goal?'🏆 '+cfg.reward:'🎁 '+cfg.reward+' · encore '+Math.max(0,goal-d.total)+' ⭐';weekBar.style.width=p+'%';weekPee.textContent=d.pee;weekPoop.textContent=d.poop;let names=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'],h='';for(let i=0;i<7;i++){let x=add(m,i),k=key(x),pp=pct(sc(db.days[k]?.state),mx());h+=`<div class="dayCard"><b>${names[i]}</b><div>${x.getDate()}/${x.getMonth()+1}</div><div style="font-size:20px;font-weight:900">${k>tk?'—':pp+'%'}</div><div>${k>tk?'⏳':pp>=80?'🌟':pp>=55?'😊':pp>=30?'☁️':'☁️'}</div></div>`}weekGrid.innerHTML=h}
function renderTreasure(){if(!cfg.kidMode){kidTreasure.innerHTML='';return}let d=wd(mon(new Date())),g=Math.round(mx()*7*cfg.goalPct/100),p=Math.min(100,pct(d.total,g));kidTreasure.innerHTML=`<div class="kidTreasure"><div class="chest">${p>=100?'🏆':'🎁'}</div><b>${cfg.reward}</b><div>${p>=100?'Trésor gagné !':'Encore '+Math.max(0,g-d.total)+' ⭐ avant le trésor'}</div><div class="progress"><div class="bar" style="width:${p}%"></div></div></div>`}
function tog(label,c,fn){return `<div class="toggleRow"><span>${label}</span><label class="switch"><input type="checkbox" ${c?'checked':''} onchange="${fn}"><span class="slider"></span></label></div>`}function renderSettings(){kidModeToggle.checked=cfg.kidMode;rewardInput.value=cfg.reward;goalRange.value=cfg.goalPct;goalValue.textContent=cfg.goalPct;for(const k of ['pee','poop']){document.getElementById(k+'CounterBtn').classList.toggle('active',cfg.pottyMode[k]==='counter');document.getElementById(k+'StarsBtn').classList.toggle('active',cfg.pottyMode[k]==='stars')}blockSettings.innerHTML=Object.entries(D).map(([k,b])=>tog(b[0],cfg.blocks[k],`toggleBlock('${k}',this.checked)`)).join('');taskSettings.innerHTML=Object.values(D).map(b=>`<h4>${b[0]}</h4>`+b[2].map(t=>tog(t[1]+' '+t[2],cfg.tasks[t[0]]!==false,`toggleTask('${t[0]}',this.checked)`)).join('')).join('')}
let entered='';function openPin(){entered='';pinError.textContent='';pinOverlay.classList.add('open');drawPin()}function closePin(){pinOverlay.classList.remove('open')}function drawPin(){pinDots.innerHTML=[0,1,2,3].map(i=>`<span class="pinDot ${i<entered.length?'on':''}"></span>`).join('');keypad.innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button class="key" onclick="pinKey('${k}')">${k}</button>`).join('')}function pinKey(k){if(k==='⌫')entered=entered.slice(0,-1);else if(k==='✓'){if(entered===cfg.parentPin){closePin();document.body.classList.remove('kid');showView('settings')}else{pinError.textContent='Code incorrect';entered=''}}else if(entered.length<4)entered+=k;drawPin()}function changePin(){let v=newPin.value.replace(/\D/g,'');if(v.length!==4){pinChangeMsg.textContent='Le code doit contenir 4 chiffres.';return}cfg.parentPin=v;save();newPin.value='';pinChangeMsg.textContent='✓ Code modifié'}
function setKidMode(v){cfg.kidMode=v;save();render();showView('today')}function setPotMode(k,v){cfg.pottyMode[k]=v;save();render()}function toggleBlock(k,v){cfg.blocks[k]=v;save();render()}function toggleTask(k,v){cfg.tasks[k]=v;save();render()}function resetToday(){if(confirm('Effacer aujourd’hui ?')){db.days[tk]={state:{},pot:{pee:0,poop:0}};save();render()}}function showView(v){['today','week','settings'].forEach(x=>{document.getElementById(x+'View').classList.toggle('active',x===v);document.getElementById(x+'Tab').classList.toggle('active',x===v)});todayHeader.style.display=v==='today'?'block':'none'}save();render();
</script>
</body>
</html>
