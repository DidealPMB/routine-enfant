<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ma semaine de champion</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#1f2937}.wrap{max-width:960px;margin:auto;padding:16px}.box{background:white;border-radius:22px;padding:18px;margin-bottom:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:800}.tab.active{background:#dbeafe}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.task{border:3px solid #e5e7eb;border-radius:18px;padding:14px}.task.great{background:#ecfdf5}.task.mid{background:#fffbeb}.task.cloud{background:#f1f5f9}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{font-size:24px;width:68px;height:58px;border:0;border-radius:16px}.good{background:#bbf7d0}.midbtn{background:#fde68a}.cloudbtn{background:#e2e8f0}.profilebar{display:flex;gap:10px;align-items:center}.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:44px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.profiles{display:flex;gap:8px;overflow:auto}.chip{border:2px solid #e5e7eb;border-radius:16px;padding:8px;min-width:90px;background:#fff}.chip.active{border-color:#2563eb}.badgegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.badge{border:3px solid #e5e7eb;border-radius:18px;padding:12px;text-align:center}.bronze{border-color:#b7794b}.silver{border-color:#94a3b8}.gold{border-color:#eab308}.legendary{border-color:#8b5cf6;background:linear-gradient(135deg,#f3e8ff,#dbeafe)}.locked{opacity:.5;filter:grayscale(1)}.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:99}.overlay.open{display:flex}.modal{background:#fff;border-radius:26px;padding:24px;max-width:380px;width:90%;text-align:center}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.key{height:56px;border:0;border-radius:15px;font-size:24px}.kid .tabs{display:none}.kid .parentbtn{display:block}.parentbtn{display:none;position:fixed;right:15px;bottom:15px;z-index:50}.finish{width:100%;padding:18px;border:0;border-radius:20px;font-size:20px;font-weight:900;background:linear-gradient(90deg,#fde047,#fb923c)}@media(max-width:650px){.grid,.badgegrid{grid-template-columns:1fr}.tab{flex:1}}</style></head><body><button class="btn parentbtn" onclick="openPin()">🔒 Parents</button><div class="overlay" id="pinOverlay"><div class="modal"><h2>🔒 Parents</h2><div id="pinDots">○ ○ ○ ○</div><div id="pinError"></div><div class="keypad" id="keypad"></div><button class="btn" onclick="closePin()">Annuler</button></div></div><div class="wrap"><div class="box"><div class="profilebar"><div class="avatar" id="topAvatar"></div><div><div id="topName" style="font-size:24px;font-weight:900"></div><h1 style="margin:3px 0">🌈 Ma semaine de champion</h1></div></div><div class="tabs"><button class="tab active" id="todayTab" onclick="showView('today')">☀️ Aujourd'hui</button><button class="tab" id="weekTab" onclick="showView('week')">📅 Semaine</button><button class="tab" id="statsTab" onclick="showView('stats')">📊 Stats & badges</button><button class="tab" id="settingsTab" onclick="showView('settings')">⚙️ Paramètres</button></div><div id="summary"></div></div><div id="todayView" class="view active"><div id="todayBlocks"></div><div class="box"><button class="finish" id="finishBtn" onclick="finishDay()">🏁 Clôturer la journée</button></div></div><div id="weekView" class="view"><div class="box"><h2>📅 Ma semaine</h2><div id="weekInfo"></div></div></div><div id="statsView" class="view"><div class="box"><h2>🏅 Badges</h2><div id="badgeSummary"></div><div class="badgegrid" id="badgeGrid"></div></div><div class="box"><h2>📊 Statistiques</h2><div id="statsInfo"></div></div></div><div id="settingsView" class="view"><div class="box"><h2>⚙️ Paramètres</h2><h3>👨‍👩‍👧 Profils</h3><div class="profiles" id="profileSelector"></div><button class="btn" onclick="addProfile()">＋ Ajouter</button><button class="btn" onclick="deleteProfile()">🗑️ Supprimer</button><h3>Profil actif</h3><input id="childNameInput" oninput="setChildName(this.value)" placeholder="Prénom"><div id="avatarChoices"></div><label class="btn">📷 Photo<input type="file" accept="image/*" style="display:none" onchange="handlePhoto(event)"></label><button class="btn" onclick="removePhoto()">Retirer photo</button><h3>🎮 Mode enfant</h3><label><input type="checkbox" id="kidToggle" onchange="setKidMode(this.checked)"> Activer</label><h3>🔐 Code parent</h3><input id="newPin" inputmode="numeric" maxlength="4"><button class="btn" onclick="changePin()">Enregistrer</button><h3>🎯 Récompense</h3><input id="rewardInput" oninput="cfg.reward=this.value;save();render()"><h3>🚽 Propreté</h3><button class="btn" onclick="togglePotMode('pee')" id="peeMode"></button><button class="btn" onclick="togglePotMode('poop')" id="poopMode"></button><h3>🧩 Blocs</h3><div id="blockSettings"></div><h3>✅ Missions</h3><div id="taskSettings"></div></div></div></div><script>
const GROUPS={morning:{title:'☀️ Matin',type:'routine',tasks:[['dress','👕','Je m’habille'],['teeth','🪥','Je me brosse les dents'],['breakfast','🥣','Je prends mon petit-déjeuner']]},behaviors:{title:'💛 Comportements',type:'behavior',tasks:[['please','🙏','Je dis s’il te plaît'],['thanks','❤️','Je dis merci'],['talk','🗣️','Je parle gentiment'],['help','🤝','J’aide'],['tidy','🧸','Je range'],['listen','👂','J’écoute'],['calm','🌬️','Je retrouve mon calme'],['table','🍽️','Je reste à table']]},rest:{title:'😴 Temps calme',type:'behavior',tasks:[['quiet-time','😴','Je respecte le temps calme']]},school:{title:'🎒 École',type:'behavior',tasks:[['homework','📚','Je fais mes activités'],['focus','🧠','Je reste concentré'],['reading','📖','Je regarde un livre']]},autonomy:{title:'🏠 Autonomie',type:'routine',tasks:[['shoes','👟','Je mets mes chaussures'],['coat','🧥','Je range mon manteau'],['laundry','🧺','Je range mon linge sale']]},cleanliness:{title:'🚽 Propreté',type:'potty',tasks:[['pot-pee','🚽','Pipi sur le pot'],['pot-poop','🚽','Caca sur le pot']]},evening:{title:'🌙 Soir',type:'routine',tasks:[['evening-wash','🛁','Je me lave'],['evening-pajamas','🥱','Je mets mon pyjama'],['evening-teeth','🪥','Je me brosse les dents'],['bedtime','🛏️','Je respecte le coucher']]}};
const avatars=['🦁','🦊','🐼','🦄','🚀','🛡️','⭐','🐯','🐸','🐻'];const APPKEY='journeeChampionMultiV2',OLDAPP='journeeChampionMultiV1',OLDDB='journeeChampionHistoryV2',OLDCF='journeeChampionConfigV1';
const baseCfg={kidMode:false,parentPin:'0000',reward:'Ma récompense surprise 🎁',childName:'Champion',avatar:'🦁',photo:'',badgesUnlocked:{},pottyMode:{pee:'counter',poop:'counter'},blocks:{morning:true,behaviors:true,rest:true,school:false,autonomy:false,cleanliness:true,evening:true},tasks:{}};
Object.values(GROUPS).forEach(g=>g.tasks.forEach(t=>baseCfg.tasks[t[0]]=!['homework','focus','reading','shoes','coat','laundry'].includes(t[0])));
const clone=x=>JSON.parse(JSON.stringify(x));const key=(d=new Date())=>d.toLocaleDateString('en-CA');
function newProfile(name='Champion',avatar='🦁'){return{id:'p'+Date.now()+Math.random().toString(36).slice(2,7),cfg:{...clone(baseCfg),childName:name,avatar},db:{days:{}}}}
function loadApp(){let a=null;try{a=JSON.parse(localStorage.getItem(APPKEY))}catch(e){}if(a&&Array.isArray(a.profiles)&&a.profiles.length)return a;try{a=JSON.parse(localStorage.getItem(OLDAPP))}catch(e){}if(a&&Array.isArray(a.profiles)&&a.profiles.length){localStorage.setItem(APPKEY,JSON.stringify(a));return a}let p=newProfile();try{let c=JSON.parse(localStorage.getItem(OLDCF));if(c)p.cfg={...p.cfg,...c,blocks:{...p.cfg.blocks,...c.blocks},tasks:{...p.cfg.tasks,...c.tasks},pottyMode:{...p.cfg.pottyMode,...c.pottyMode},badgesUnlocked:{...p.cfg.badgesUnlocked,...c.badgesUnlocked}}}catch(e){}try{let d=JSON.parse(localStorage.getItem(OLDDB));if(d&&d.days)p.db=d}catch(e){}return{activeId:p.id,profiles:[p]}}
let app=loadApp(),profile,cfg,db;
function bind(){profile=app.profiles.find(p=>p.id===app.activeId)||app.profiles[0];app.activeId=profile.id;profile.cfg=profile.cfg||clone(baseCfg);profile.db=profile.db||{days:{}};cfg=profile.cfg;db=profile.db;cfg.blocks={...baseCfg.blocks,...cfg.blocks};cfg.tasks={...baseCfg.tasks,...cfg.tasks};cfg.pottyMode={...baseCfg.pottyMode,...cfg.pottyMode};cfg.badgesUnlocked=cfg.badgesUnlocked||{};cfg.parentPin=cfg.parentPin||'0000';db.days=db.days||{};db.days[key()]=db.days[key()]||{state:{},pot:{pee:0,poop:0},closed:false};db.days[key()].pot=db.days[key()].pot||{pee:0,poop:0}}
function save(){localStorage.setItem(APPKEY,JSON.stringify(app))}bind();save();
function activeIds(){const a=[];for(const [gk,g] of Object.entries(GROUPS)){if(!cfg.blocks[gk])continue;for(const t of g.tasks){if(cfg.tasks[t[0]]===false)continue;if(g.type==='potty'){const k=t[0]==='pot-pee'?'pee':'poop';if(cfg.pottyMode[k]!=='stars')continue}a.push(t[0])}}return a}
function score(state={}){return activeIds().reduce((n,id)=>n+(state[id]??0),0)}function maxScore(){return activeIds().length*2}function percent(n,m){return m?Math.round(n/m*100):0}
function taskCard(t){const v=db.days[key()].state[t[0]];return `<div class="task ${v===2?'great':v===1?'mid':v===0?'cloud':''}"><div style="font-size:42px">${t[1]}</div><h3>${t[2]}</h3><div class="choices"><button class="choice good" onclick="mark('${t[0]}',2)">🌟</button><button class="choice midbtn" onclick="mark('${t[0]}',1)">😊</button><button class="choice cloudbtn" onclick="mark('${t[0]}',0)">☁️</button></div></div>`}
function pottyCard(t){const k=t[0]==='pot-pee'?'pee':'poop',n=db.days[key()].pot[k]||0;if(cfg.pottyMode[k]==='stars')return taskCard(t);return `<div class="task"><div style="font-size:42px">🚽</div><h3>${t[2]}</h3><div style="font-size:34px;font-weight:900">${n}</div><button class="btn" onclick="pot('${k}',-1)">−</button><button class="btn" onclick="pot('${k}',1)">＋</button></div>`}
function renderToday(){const day=db.days[key()];if(day.closed){document.getElementById('todayBlocks').innerHTML=`<div class="box"><h2>🏁 Journée clôturée</h2><p>⭐ ${score(day.state)} étoiles</p><button class="btn" onclick="reopenDay()">🔓 Rouvrir</button></div>`;document.getElementById('finishBtn').style.display='none';return}document.getElementById('finishBtn').style.display='block';let html='';for(const[gk,g]of Object.entries(GROUPS)){if(!cfg.blocks[gk])continue;const tasks=g.tasks.filter(t=>cfg.tasks[t[0]]!==false);if(!tasks.length)continue;html+=`<div class="box"><h2>${g.title}</h2><div class="grid">${tasks.map(t=>g.type==='potty'?pottyCard(t):taskCard(t)).join('')}</div></div>`}document.getElementById('todayBlocks').innerHTML=html}
function mark(id,v){if(db.days[key()].closed)return;const s=db.days[key()].state;s[id]=s[id]===v?undefined:v;if(s[id]===undefined)delete s[id];save();render()}function pot(k,d){if(db.days[key()].closed)return;db.days[key()].pot[k]=Math.max(0,(db.days[key()].pot[k]||0)+d);save();render()}
function finishDay(){const d=db.days[key()];if(d.closed)return;if(!confirm('Clôturer la journée ?'))return;d.closed=true;d.closedAt=new Date().toISOString();save();const newly=updateBadges();render();if(newly)showBadge(newly)}function reopenDay(){db.days[key()].closed=false;save();render()}
function allDays(){return Object.entries(db.days).sort((a,b)=>a[0].localeCompare(b[0]))}function totals(){let stars=0,pot=0,closed=0;for(const[,d]of allDays()){stars+=score(d.state);pot+=(d.pot?.pee||0)+(d.pot?.poop||0);if(d.closed)closed++}return{stars,pot,closed}}function streak(){let c=0,b=0;for(const[,d]of allDays()){if(d.closed&&percent(score(d.state),maxScore())>=55){c++;b=Math.max(b,c)}else if(d.closed)c=0}return b}
const BADGES=[['first','🎈','Première aventure','bronze',()=>totals().closed>=1],['stars25','⭐','25 étoiles','bronze',()=>totals().stars>=25],['pot5','🚽','5 réussites au pot','bronze',()=>totals().pot>=5],['day90','🏆','Journée en or','silver',()=>Object.values(db.days).some(d=>d.closed&&percent(score(d.state),maxScore())>=90)],['stars50','🌠','50 étoiles','silver',()=>totals().stars>=50],['streak3','🔥','3 jours de suite','silver',()=>streak()>=3],['stars100','💯','100 étoiles','gold',()=>totals().stars>=100],['streak5','🔥','5 jours de suite','gold',()=>streak()>=5],['stars250','💎','250 étoiles','legendary',()=>totals().stars>=250],['streak7','🌈','7 jours de suite','legendary',()=>streak()>=7],['days30','🦸','30 journées clôturées','legendary',()=>totals().closed>=30]];
function updateBadges(){for(const b of BADGES){if(!cfg.badgesUnlocked[b[0]]&&b[4]()){cfg.badgesUnlocked[b[0]]=new Date().toISOString();save();return b}}return null}function showBadge(b){const o=document.createElement('div');o.className='overlay open';o.innerHTML=`<div class="modal"><div style="font-size:90px">${b[1]}</div><h2>✨ NOUVEAU BADGE ✨</h2><h1>${b[2]}</h1><p>${b[3].toUpperCase()}</p><button class="btn" onclick="this.closest('.overlay').remove()">Trop bien ! 🎉</button></div>`;document.body.appendChild(o)}
function renderBadges(){document.getElementById('badgeSummary').textContent=`${BADGES.filter(b=>cfg.badgesUnlocked[b[0]]).length}/${BADGES.length} débloqués`;document.getElementById('badgeGrid').innerHTML=BADGES.map(b=>`<div class="badge ${cfg.badgesUnlocked[b[0]]?b[3]:'locked'}"><div style="font-size:44px">${cfg.badgesUnlocked[b[0]]?b[1]:'🔒'}</div><b>${b[2]}</b><div>${b[3]}</div></div>`).join('')}
function renderWeek(){const t=totals();document.getElementById('weekInfo').innerHTML=`<p>⭐ Total profil : <b>${t.stars}</b></p><p>🏁 Journées clôturées : <b>${t.closed}</b></p><p>🚽 Réussites pot : <b>${t.pot}</b></p>`}function renderStats(){const t=totals();document.getElementById('statsInfo').innerHTML=`⭐ ${t.stars} étoiles · 🔥 série max ${streak()} · 🏁 ${t.closed} jours`;renderBadges()}
function avatarHtml(){return cfg.photo?`<img src="${cfg.photo}">`:cfg.avatar}function profileStars(p){const oldCfg=cfg,oldDb=db;cfg=p.cfg;db=p.db;const n=totals().stars;cfg=oldCfg;db=oldDb;return n}function renderProfiles(){document.getElementById('topAvatar').innerHTML=avatarHtml();document.getElementById('topName').textContent=cfg.childName;document.getElementById('profileSelector').innerHTML=app.profiles.map(p=>`<button class="chip ${p.id===app.activeId?'active':''}" onclick="switchProfile('${p.id}')"><div>${p.cfg.photo?'📷':p.cfg.avatar}</div><b>${p.cfg.childName}</b><div>⭐ ${profileStars(p)}</div></button>`).join('');document.getElementById('childNameInput').value=cfg.childName;document.getElementById('avatarChoices').innerHTML=avatars.map(a=>`<button class="btn" onclick="chooseAvatar('${a}')">${a}</button>`).join('')}
function addProfile(){const name=prompt('Prénom du nouvel enfant ?','Champion');if(!name)return;const p=newProfile(name,avatars[app.profiles.length%avatars.length]);app.profiles.push(p);app.activeId=p.id;bind();save();render()}function switchProfile(id){app.activeId=id;bind();save();render()}function deleteProfile(){if(app.profiles.length===1)return alert('Il faut garder un profil.');if(!confirm('Supprimer ce profil et son historique ?'))return;app.profiles=app.profiles.filter(p=>p.id!==app.activeId);app.activeId=app.profiles[0].id;bind();save();render()}function setChildName(v){cfg.childName=v||'Champion';save();renderProfiles()}function chooseAvatar(a){cfg.avatar=a;cfg.photo='';save();renderProfiles()}function handlePhoto(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{cfg.photo=r.result;save();renderProfiles()};r.readAsDataURL(f)}function removePhoto(){cfg.photo='';save();renderProfiles()}
function renderSettings(){document.getElementById('kidToggle').checked=cfg.kidMode;document.getElementById('rewardInput').value=cfg.reward;document.getElementById('peeMode').textContent=`Pipi : ${cfg.pottyMode.pee==='counter'?'🔢 Compteur':'⭐ Étoiles'}`;document.getElementById('poopMode').textContent=`Caca : ${cfg.pottyMode.poop==='counter'?'🔢 Compteur':'⭐ Étoiles'}`;document.getElementById('blockSettings').innerHTML=Object.entries(GROUPS).map(([k,g])=>`<label><input type="checkbox" ${cfg.blocks[k]?'checked':''} onchange="cfg.blocks['${k}']=this.checked;save();render()"> ${g.title}</label><br>`).join('');document.getElementById('taskSettings').innerHTML=Object.values(GROUPS).map(g=>`<h4>${g.title}</h4>`+g.tasks.map(t=>`<label><input type="checkbox" ${cfg.tasks[t[0]]!==false?'checked':''} onchange="cfg.tasks['${t[0]}']=this.checked;save();render()"> ${t[1]} ${t[2]}</label><br>`).join('')).join('')}
function togglePotMode(k){cfg.pottyMode[k]=cfg.pottyMode[k]==='counter'?'stars':'counter';save();render()}function setKidMode(v){cfg.kidMode=v;save();render();showView('today')}function changePin(){const v=document.getElementById('newPin').value.replace(/\D/g,'');if(v.length!==4)return alert('4 chiffres');cfg.parentPin=v;save();document.getElementById('newPin').value='';alert('Code modifié')}
let entered='';function openPin(){entered='';document.getElementById('pinError').textContent='';document.getElementById('pinOverlay').classList.add('open');drawPin()}function closePin(){document.getElementById('pinOverlay').classList.remove('open')}function drawPin(){document.getElementById('pinDots').textContent='● '.repeat(entered.length)+'○ '.repeat(4-entered.length);document.getElementById('keypad').innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button class="key" onclick="pinKey('${k}')">${k}</button>`).join('')}function pinKey(k){if(k==='⌫')entered=entered.slice(0,-1);else if(k==='✓'){if(entered===cfg.parentPin){closePin();document.body.classList.remove('kid');showView('settings')}else{entered='';document.getElementById('pinError').textContent='Code incorrect'}}else if(entered.length<4)entered+=k;drawPin()}
function showView(v){for(const x of ['today','week','stats','settings']){document.getElementById(x+'View').classList.toggle('active',x===v);document.getElementById(x+'Tab').classList.toggle('active',x===v)}}function render(){bind();document.body.classList.toggle('kid',cfg.kidMode);renderProfiles();renderToday();renderWeek();renderStats();renderSettings();const d=db.days[key()],n=score(d.state),m=maxScore();document.getElementById('summary').innerHTML=`<p>⭐ <b>${n} / ${m}</b> ${d.closed?'· 🏁 clôturée':''}</p>`}render();
</script></body></html>
